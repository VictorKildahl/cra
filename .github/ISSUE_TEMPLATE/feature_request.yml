name: Feature request
description: Something Arc did that Cra doesn't do yet.
labels: [enhancement]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app
      options:
        - Mac
        - iPhone
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What it should do, and what you'd use it for.
    validations:
      required: true
  - type: textarea
    id: arc
    attributes:
      label: How Arc did it
      description: How it looked and behaved in Arc (or Arc Search, for the iPhone). Screenshots or a recording from Arc are gold.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        An idea Arc never had goes in [Ideas](https://github.com/VictorKildahl/cra/discussions/categories/ideas) instead, where others can upvote it. Cra has no cloud AI (only the device's own Apple Intelligence), no account and no telemetry, so requests in those directions will be closed. The [roadmap](https://crabrowser.app/roadmap) lists what's already planned.
