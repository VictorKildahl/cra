name: Bug report
description: Something in Cra doesn't work, or works differently from Arc (or, on iPhone, Arc Search).
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app
      options:
        - Mac
        - iPhone
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Cra did instead. A screenshot or screen recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
      placeholder: |
        1. Open a new tab with ⌘T
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cra version
      description: "Mac: Cra ▸ About Cra, or the first line of the Help menu. iPhone: the bottom of App Settings, or the build in TestFlight."
      placeholder: 0.1.14 (Chromium 156.0.8078.48)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS or iOS version
      placeholder: macOS 26.1 / iOS 26.1 on iPhone 16 Pro
    validations:
      required: true
  - type: dropdown
    id: from
    attributes:
      label: Imported from
      description: Which browser you brought your data over from, if any.
      options:
        - Nothing
        - Arc
        - Dia
        - Chrome, Brave, Edge or another Chromium browser
        - Firefox or Zen
        - Safari
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Extensions involved, a managed (MDM) Mac, or lines from ~/Library/Application Support/Cra/chromium.log.
