name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # No Chromium download: Packages/CraCore and the harnesses compile only the files they test.
    runs-on: macos-26
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: CraCore, harnesses and lint
        run: scripts/test.sh

      # Changed lines under test >= 70 %, CraCore >= 85 % (docs/testing.md).
      - name: Coverage
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          set -o pipefail
          scripts/coverage.py --base "${{ github.event.pull_request.base.sha || github.event.before }}" | tee coverage.md

      # Fork pull requests get a read-only token: the job summary has the same table.
      - name: Coverage comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -s coverage.md ] || exit 0
          { echo "### Coverage"; echo; cat coverage.md; } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last 2>/dev/null || gh pr comment "$PR" --body-file comment.md

  build:
    name: Build Cra.app
    # Same runner as release.yml, so CI builds what ships.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned CEF version
        id: cef
        run: echo "version=$(sed -n 's/^CEF_VERSION="${CEF_VERSION:-\(.*\)}"$/\1/p' scripts/fetch-cef.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache CEF
        uses: actions/cache@v6
        with:
          path: vendor/cef
          key: cef-${{ runner.arch }}-${{ steps.cef.outputs.version }}-${{ hashFiles('scripts/fetch-cef.sh') }}

      - name: Build (debug, ad-hoc signed)
        run: scripts/build.sh debug

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/Cra.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Cra.app/Contents/Info.plist

      # Launches the app three times and quits it; fails on a crash, hang or crash report.
      # Not blocking until it has proved steady on the hosted runners.
      - name: Smoke test
        continue-on-error: true
        timeout-minutes: 5
        run: Tests/smoke-launch.sh build/Cra.app

      # One short journey on every pull request (thirty tabs put to sleep); the full set and the
      # component snapshots run nightly (nightly.yml). Not blocking until steady on these runners.
      - name: Scenario
        continue-on-error: true
        timeout-minutes: 5
        run: scripts/scenario.sh sleep-tabs

      - name: Keep scenario logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-logs
          path: build/scenarios
          if-no-files-found: ignore
