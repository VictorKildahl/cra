name: CI

# A change to docs alone runs nothing (and so doesn't cancel the run in progress).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests run in parts on separate runners at once (scripts/coverage.py --part): one runner had
  # about 1,600 s of suites queued on its few cores. The Tests job below merges their coverage and
  # applies the gates, so it is the one check that says whether the tests passed.
  test-core:
    name: Tests (CraCore)
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: scripts/lint.py

      # A failing test fails this step with its output, after the part has written what it measured.
      - name: CraCore with coverage
        run: scripts/coverage.py --part core --emit coverage-core.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-core
          path: coverage-core.json
          if-no-files-found: ignore

  test-harnesses:
    name: Tests (harnesses ${{ matrix.share }}/2)
    # No Chromium download: the harnesses compile only the files they test.
    runs-on: xcode-27
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2]
    steps:
      - uses: actions/checkout@v7

      # CraCore as the harnesses link it (scripts/harness-cracore.sh), kept between runs: a change that
      # leaves CraCore alone links the last one instead of building it. The script checks the sources,
      # flags and compiler itself, so a copy that doesn't match is rebuilt, never used.
      - name: Compiler version
        id: swift
        run: echo "hash=$(xcrun swiftc --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore CraCore for the harnesses
        id: cracore
        uses: actions/cache/restore@v6
        with:
          path: |
            build/harness-cracore
            !build/harness-cracore/.building.*
          key: harness-cracore-${{ runner.arch }}-${{ steps.swift.outputs.hash }}-${{ hashFiles('Packages/CraCore/Sources/CraCore/*.swift', 'Packages/CraCore/Sources/CraCore/Perf/*.swift', 'scripts/harness-cracore.sh') }}

      - name: Harnesses with coverage
        run: scripts/coverage.py --part "harnesses:${{ matrix.share }}/2" --emit "coverage-harnesses-${{ matrix.share }}.json"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-harnesses-${{ matrix.share }}
          path: coverage-harnesses-${{ matrix.share }}.json
          if-no-files-found: ignore

      # Also when a test failed: the library was built either way. One share saves it; both built the same.
      - name: Keep CraCore for the harnesses
        if: always() && matrix.share == 1 && steps.cracore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/harness-cracore
            !build/harness-cracore/.building.*
          key: ${{ steps.cracore.outputs.cache-primary-key }}

  test:
    name: Tests
    needs: [test-core, test-harnesses]
    if: always()
    # Only git and Python: the parts' lines, merged. Gates: changed lines under test >= 70 %,
    # CraCore >= 85 % (docs/testing.md).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Parts
        if: needs.test-core.result != 'success' || needs.test-harnesses.result != 'success'
        run: |
          echo "A part failed (CraCore: ${{ needs.test-core.result }}, harnesses: ${{ needs.test-harnesses.result }}); its log has the failing suite's output."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      # A new branch's first push has no base: no changed lines to measure, the CraCore gate still applies.
      - name: Coverage
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          [ "$BASE" != 0000000000000000000000000000000000000000 ] || BASE=HEAD
          python3 -I scripts/coverage.py --report coverage-core.json coverage-harnesses-1.json coverage-harnesses-2.json --base "$BASE" | tee coverage.md

      # Fork pull requests get a read-only token: the job summary has the same table.
      - name: Coverage comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -s coverage.md ] || exit 0
          { echo "### Coverage"; echo; cat coverage.md; } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last 2>/dev/null || gh pr comment "$PR" --body-file comment.md

  iphone:
    name: Build the iPhone app
    # No Chromium and no signing: the app, its widgets and share extension for the simulator.
    # Its UI tests (docs/ios.md) take over ten minutes and run on a Mac, not here.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Build for the iOS simulator
        run: |
          set -o pipefail
          xcodebuild -project iOS/Cra.xcodeproj -scheme Cra -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build | tail -20

  build:
    name: Build Cra.app
    # Same runner as release.yml, so CI builds what ships.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Cache the engine
        uses: actions/cache@v6
        with:
          path: vendor/engine
          key: engine-${{ runner.arch }}-${{ hashFiles('scripts/fetch-engine.sh') }}

      - name: Build (debug, ad-hoc signed)
        run: scripts/build.sh debug

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/Cra.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Cra.app/Contents/Info.plist

      # Cra's icon as this runner's Xcode 27 builds it from resources/AppIcon.icon (catalog, .icns, Settings tile), so
      # its Dock looks can be checked on a Mac with an older Xcode or macOS (GitHub #739).
      - name: Keep the app icon
        uses: actions/upload-artifact@v7
        with:
          name: app-icon
          path: build/app-icon

      # Launches the app three times and quits it; fails on a crash, hang or crash report.
      # Not blocking until it has proved steady on the hosted runners.
      - name: Smoke test
        continue-on-error: true
        timeout-minutes: 5
        run: Tests/smoke-launch.sh build/Cra.app

      # One short journey on every pull request (thirty tabs put to sleep); the full set and the
      # component snapshots run nightly (nightly.yml). Not blocking until steady on these runners.
      - name: Scenario
        continue-on-error: true
        timeout-minutes: 5
        run: scripts/scenario.sh sleep-tabs

      - name: Keep scenario logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-logs
          path: build/scenarios
          if-no-files-found: ignore

  build-intel:
    name: Build Cra.app (Intel)
    # Every release ships an Intel copy too (scripts/release.sh), cross-compiled on this runner.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Cache the engine
        uses: actions/cache@v6
        with:
          path: vendor/engine-x86_64
          key: engine-x86_64-${{ hashFiles('scripts/fetch-engine.sh') }}

      - name: Build (debug, ad-hoc signed)
        run: CRA_ARCH=x86_64 scripts/build.sh debug

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/x86_64/Cra.app
          lipo -archs build/x86_64/Cra.app/Contents/MacOS/Cra
