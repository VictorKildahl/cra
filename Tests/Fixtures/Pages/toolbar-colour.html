<!doctype html>
<meta charset="utf-8">
<!-- GitHub's case (#629): a dark theme-color over a page whose top is a light header. Arc's bar
     is the header's colour, read off the page's top-right corner when the load ends. -->
<meta name="theme-color" content="#1e2327">
<title>Toolbar colour</title>
<body style="margin:0;background:#ffffff;font:15px -apple-system, sans-serif">
<div style="height:64px;background:#f6f8fa;border-bottom:1px solid #d1d9e0"></div>
<p style="margin:24px">A light header under a dark theme-color.</p>
<div style="height:3000px"></div>
