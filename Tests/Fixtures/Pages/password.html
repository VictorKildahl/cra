<!doctype html>
<meta charset="utf-8">
<title>Password</title>
<!-- A sign-in form whose password field takes the keys as soon as it loads, as a login page's does.
     The secure-input scenario checks that Cra turns macOS Secure Input on only while it is the app in front. -->
<form>
  <input id="user" name="user" autocomplete="username" value="someone">
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
</form>
<script>
  document.getElementById('password').focus();
</script>
