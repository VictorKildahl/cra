  chrome.webstorePrivate.beginInstallWithManifest3(
    { id: "jeackjeedkojbpbfclolioidbpgjnnjg", manifest, localizedName: "Cra Scenario Fixture" },
    result => { document.title = "answered: " + result; });
  return "asked";
}
</script>
